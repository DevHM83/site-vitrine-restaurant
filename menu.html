<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Découvrez notre menu de plats internationaux : lasagnes, couscous, thiéboudienne, tacos, butter chicken et ramen."
    />
    <title>Saveurs du Monde | Menu</title>
    <link rel="stylesheet" href="public/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <h1 class="logo">Saveurs du Monde</h1>
        <!-- J'utilise ici l'attribut HTML Popover qui me permet de créer un menu burger sans utiliser JavaScript. --- https://developer.mozilla.org/en-US/docs/Web/API/Popover_API --- -->
        <button class="burger-btn" popovertarget="main-nav">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav id="main-nav" popover>
          <button
            class="close-btn"
            popovertarget="main-nav"
            popovertargetaction="hide"
          >
            ×
          </button>
          <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="menu.html" class="active">Menu</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="menu">
      <div class="container">
        <h2>Notre Menu</h2>
        <p class="menu-intro">
          Découvrez nos plats emblématiques, préparés avec des ingrédients frais
          et des recettes traditionnelles.
        </p>

        <!-- Liste des plats par pays -->
        <div class="menu-grid"></div>
      </div>
    </section>
    <footer>
      <div class="container">
        <p>&copy; 2026 Saveurs du Monde. Tous droits réservés.</p>
        <p>
          Suivez-nous sur : <a href="#">Facebook</a> |
          <a href="#">Instagram</a>
        </p>
      </div>
    </footer>
    <script type="module" src="public/js/menu.js"></script>
  </body>
</html>
